services:
  db: 
    image: mysql
    container_name: mysql-container
    restart: always
    networks: 
        default:
          aliases: 
            - database
    environment:
      MYSQL_ROOT_PASSWORD:  wes123
      MYSQL_DATABASE: biblioteca
    volumes:
      - ./db/data:/var/lib/mysql  
      - ./init-scripts:/docker-entrypoint-initdb.d